id: dl5eu_dvbt_ofdm_synchronization
label: DVB-T OFDM Synchronization
category: '[dl5eu]'

templates:
  imports: from gnuradio import dl5eu
  make: dl5eu.dvbt_ofdm_synchronization(${transmission_mode.val}, ${guard_interval.val}, ${snr}, ${interpolate}, ${sample_rate}, ${squelch_db}, ${diagnostics})
  callbacks:
  - set_sample_rate(${sample_rate})
  - set_squelch_threshold(${squelch_db})

parameters:
- id: transmission_mode
  label: Transmission Mode
  dtype: enum
  options: [T2k, T8k]
  option_labels: [2K, 8K]
  option_attributes:
    fft_length: [2048, 8192]
    num_carriers: [1705, 6817]
    payload_carriers: [1512, 6048]
    val: [dtv.T2k, dtv.T8k]
- id: guard_interval
  label: Guard Interval
  dtype: enum
  options: [GI_1_32, GI_1_16, GI_1_8, GI_1_4]
  option_labels: [1/32, 1/16, 1/8, 1/4]
  option_attributes:
    val: [dtv.GI_1_32, dtv.GI_1_16, dtv.GI_1_8, dtv.GI_1_4]
- id: snr
  label: SNR
  dtype: float
  default: '10.0'
- id: interpolate
  label: Interpolate
  dtype: enum
  default: 'True'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']
- id: sample_rate
  label: Sample Rate After Resampling (Hz)
  dtype: float
  default: '8e6/7'
- id: squelch_db
  label: Squelch Threshold (dBFS, -200 disables)
  dtype: float
  default: '-60.0'
- id: diagnostics
  label: Verbose Diagnostics
  dtype: bool
  default: 'False'

inputs:
- label: in
  domain: stream
  dtype: complex
  vlen: 1
  optional: false

outputs:
- label: out
  domain: stream
  dtype: complex
  vlen: ${transmission_mode.num_carriers}
  optional: false
- label: ch. taps
  domain: stream
  dtype: complex
  vlen: ${transmission_mode.num_carriers}
  optional: true
- label: freq. err.
  domain: stream
  dtype: float
  vlen: 1
  optional: true
- label: samp. err.
  domain: stream
  dtype: float
  vlen: 1
  optional: true

documentation: |-
  The optional frequency-error output is in Hz.
  The optional sampling-rate-error output is in ppm.
  Sample Rate is the nominal complex sample rate at this block input,
  i.e. AFTER any Rational Resampler or decimating low-pass filter.
  Changing the nominal sample rate while running requests fresh acquisition
  and marks the next output with sync_start for downstream decoder restart.
  For DVB-T channels it is usually 8/7 times the channel bandwidth.
  Squelch is based on uncalibrated mean digital IQ power at this block input.
  It is not a calibrated RF level (dBm); the optimum value depends on gain
  and input scaling. The squelch closes 3 dB below its opening threshold.
  Use -200 to disable. The threshold can be changed while running, e.g.
  from a QT GUI Range connected to this parameter.
  Verbose Diagnostics adds expensive CP probes.

file_format: 1
