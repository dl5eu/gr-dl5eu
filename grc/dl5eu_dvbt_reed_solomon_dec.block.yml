id: dl5eu_dvbt_reed_solomon_dec
label: DVB-T Reed-Solomon Decoder
category: '[dl5eu]'
flags: [ python, cpp ]

parameters:
-   id: p
    label: p
    dtype: int
    default: '2'
-   id: m
    label: m
    dtype: int
    default: '8'
-   id: gfpoly
    label: GF polynomial
    dtype: raw
    default: '0x11d'
-   id: n
    label: N
    dtype: int
    default: '255'
-   id: k
    label: K
    dtype: int
    default: '239'
-   id: t
    label: t
    dtype: int
    default: '8'
-   id: s
    label: Shortening size
    dtype: int
    default: '51'
-   id: blocks
    label: Blocks
    dtype: int
    default: '8'
-   id: diagnostics
    label: Diagnostics
    dtype: bool
    default: 'False'

inputs:
-   domain: stream
    dtype: byte
    vlen: ${ blocks*(n-s) }

outputs:
-   domain: stream
    dtype: byte
    vlen: ${ blocks*(k-s) }

templates:
  imports: from gnuradio import dl5eu
  make: dl5eu.dvbt_reed_solomon_dec(${p}, ${m}, ${gfpoly}, ${n}, ${k}, ${t}, ${s}, ${blocks}, ${diagnostics})

cpp_templates:
    includes: ['#include <gnuradio/dl5eu/dvbt_reed_solomon_dec.h>']
    declarations: 'dl5eu::dvbt_reed_solomon_dec::sptr ${id};'
    make: |-
        this->${id} = dl5eu::dvbt_reed_solomon_dec::make(
            ${p},
            ${m},
            ${gfpoly},
            ${n},
            ${k},
            ${t},
            ${s},
            ${blocks},
            ${diagnostics});
    link: ['gnuradio::gnuradio-dl5eu']

file_format: 1
